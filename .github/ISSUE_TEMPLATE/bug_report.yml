name: Bug Report
description: Report a bug in Keycloak Phone Authenticator
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below.
  - type: input
    id: keycloak-version
    attributes:
      label: Keycloak Version
      placeholder: e.g., 26.3.1
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      placeholder: e.g., 1.0.0
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java Version
      placeholder: e.g., 21.0.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output (sensitive data will be masked automatically by the plugin)
      render: shell
  - type: dropdown
    id: sms-provider
    attributes:
      label: SMS Provider Mode
      options:
        - Twilio (production)
        - Development mode (console logging)
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have checked the troubleshooting section in README
          required: true
