name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run tests
      run: mvn test

    - name: Verify JAR structure
      run: |
        echo "=== JAR Contents ==="
        jar tf target/keycloak-phone-authenticator-*.jar | head -50
        echo ""
        echo "=== Checking SPI registration ==="
        jar tf target/keycloak-phone-authenticator-*.jar | grep -E "META-INF/services|AuthenticatorFactory"

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: keycloak-phone-authenticator
        path: target/keycloak-phone-authenticator-*.jar
        retention-days: 7
