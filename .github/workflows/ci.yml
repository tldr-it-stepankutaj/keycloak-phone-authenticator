name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run tests
      run: mvn test

    - name: Verify JAR structure
      run: |
        JAR=$(ls target/keycloak-phone-authenticator-*.jar | head -1)
        echo "=== $JAR ==="
        jar tf "$JAR" > jar-contents.txt
        fail=0
        for entry in \
          META-INF/services/org.keycloak.authentication.AuthenticatorFactory \
          com/tegadeti/keycloak/provider/PhoneAuthenticatorFactory.class \
          com/tegadeti/keycloak/provider/PhoneAuthenticator.class \
          com/tegadeti/keycloak/provider/SmsService.class \
          com/tegadeti/keycloak/provider/TwilioSmsProvider.class \
          com/tegadeti/keycloak/provider/HttpSmsProvider.class \
          com/twilio/rest/api/v2010/account/Message.class \
          com/google/i18n/phonenumbers/PhoneNumberUtil.class; do
          if grep -qx "$entry" jar-contents.txt; then echo "OK      $entry"; else echo "MISSING $entry"; fail=1; fi
        done
        # Keycloak provides Jackson - a second copy in the jar would conflict
        if grep -q "^com/fasterxml/jackson/\(core\|databind\|annotation\|datatype\)/" jar-contents.txt; then
          echo "Jackson must not be bundled"; fail=1
        fi
        exit $fail

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: keycloak-phone-authenticator
        path: target/keycloak-phone-authenticator-*.jar
        retention-days: 7
