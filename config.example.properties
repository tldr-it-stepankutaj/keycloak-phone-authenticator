# Twilio Configuration Example
# Copy this file to config.properties and fill in your values
# DO NOT commit config.properties to version control!

# Twilio Account Credentials
# Get these from https://console.twilio.com/
twilio.account.sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
twilio.auth.token=your_auth_token_here

# Twilio Phone Number for sending SMS
# Must be a verified Twilio phone number in E.164 format
twilio.from.number=+1234567890

# SMS Configuration
# How long is the SMS code valid (in seconds)
sms.code.ttl=300

# Length of the SMS verification code (4-8 digits)
sms.code.length=6

# User Management
# Whether to create new users automatically when phone number is not found
create.user.if.not.exists=true

# SMS Message Template (optional - can be customized in code)
# Use %s as placeholder for the verification code
sms.message.template=Vá? ov??ovací kód: %s\n\nKód je platný 5 minut.

# Rate Limiting (optional - not implemented in basic version)
# Max SMS per phone number per hour
rate.limit.per.phone=5

# Max SMS per IP address per hour
rate.limit.per.ip=20

# Development/Testing
# Set to true to log SMS codes instead of sending (for development)
development.mode=false

# Test phone number for configuration validation
test.phone.number=+420123456789