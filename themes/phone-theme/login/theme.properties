# Phone Authentication login theme
#
# This file must live in the theme TYPE directory (themes/phone-theme/login/) - Keycloak does not read a
# theme.properties from the theme root, and without it the theme has no parent and no template.ftl.
parent=keycloak.v2
import=common/keycloak

# Own styles are appended to the parent's (a child's "styles" replaces the parent's list, so the parent's
# css/styles.css has to be listed too)
styles=css/styles.css css/phone-auth.css

# Languages offered by the theme (messages/messages_*.properties)
locales=cs,en,sk
